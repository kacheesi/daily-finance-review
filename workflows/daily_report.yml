# 每日金融复盘 —— 云端自动化
# 每天北京时间 17:00（UTC 09:00）自动运行：
#   采集 A股/期货/币 → 技术分析 → 生成报告 → 发布到 GitHub Pages（多设备可访问）
# 也可在 Actions 页手动 "Run workflow" 立即执行一次。
name: 每日金融复盘

on:
  schedule:
    - cron: "0 9 * * *"      # 北京时间 17:00（GitHub cron 使用 UTC）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载 ECharts 离线包
        run: python scripts/seed_vendor.py

      - name: 运行每日复盘（云端模式）
        env:
          DAILY_REVIEW_CLOUD: "1"     # 海外环境：腾讯/新浪优先，东财兜底
          TZ: "Asia/Shanghai"          # 报告日期按北京时间
        run: python run_daily.py --force

      - name: 准备发布目录
        run: |
          mkdir -p _site/reports _site/data/vendor
          cp data/reports/daily_report.html _site/index.html
          cp data/reports/*.html _site/reports/ 2>/dev/null || true
          cp data/vendor/echarts.min.js _site/data/vendor/
          echo "发布内容："
          ls -la _site _site/reports _site/data/vendor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
